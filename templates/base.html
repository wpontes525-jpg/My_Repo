        <a href="{{ url_for('dashboard') }}" class="nav-item {% if request.endpoint == 'dashboard' %}active{% endif %}">
            <i class="fas fa-chart-pie"></i>
            <span>Dashboard</span>
        </a>
        <a href="{{ url_for('contas_pagar') }}" class="nav-item {% if request.endpoint == 'contas_pagar' %}active{% endif %}">
            <i class="fas fa-arrow-trend-down"></i>
            <span>Contas a Pagar</span>
        </a>
        <a href="{{ url_for('contas_receber') }}" class="nav-item {% if request.endpoint == 'contas_receber' %}active{% endif %}">
            <i class="fas fa-arrow-trend-up"></i>
            <span>Contas a Receber</span>
        </a>
        <a href="{{ url_for('fornecedores') }}" class="nav-item {% if request.endpoint == 'fornecedores' %}active{% endif %}">
            <i class="fas fa-building"></i>
            <span>Fornecedores</span>
        </a>
        <a href="{{ url_for('relatorio') }}" class="nav-item {% if request.endpoint == 'relatorio' %}active{% endif %}">
            <i class="fas fa-file-chart-column"></i>
            <span>Relatório</span>
        </a>
    </nav>

    <!-- ALERTAS SIDEBAR -->
    <div class="sidebar-alerts" id="sidebarAlerts">
        <div class="alerts-title">
            <i class="fas fa-bell"></i> Alertas
            <span class="badge-alert" id="alertCount">0</span>
        </div>
        <div id="alertsList" class="alerts-list">
            <div class="alert-empty">Sem alertas pendentes</div>
        </div>
    </div>

    <div class="sidebar-footer">
        <span class="user-info"><i class="fas fa-user-circle"></i> {{ session.get('username', 'Admin') }}</span>
        <a href="{{ url_for('logout') }}" class="btn-logout" title="Sair">
            <i class="fas fa-sign-out-alt"></i>
        </a>
    </div>
</aside>

<!-- MAIN -->
<main class="main-content" id="mainContent">
    <!-- TOPBAR -->
    <header class="topbar">
        <button class="btn-icon" id="sidebarToggle" title="Menu">
            <i class="fas fa-bars"></i>
        </button>
        <div class="topbar-right">
            <button class="btn-icon" id="darkModeToggle" title="Alternar tema">
                <i class="fas fa-moon" id="themeIcon"></i>
            </button>
            <button class="btn-icon" id="fullscreenBtn" title="Tela cheia">
                <i class="fas fa-expand"></i>
            </button>
        </div>
    </header>

    <!-- PAGE CONTENT -->
    <div class="page-content">
        {% block content %}{% endblock %}
    </div>
</main>

<!-- MODAL CONTAINER -->
<div id="modalOverlay" class="modal-overlay hidden" onclick="closeModal(event)">
    <div id="modalBox" class="modal-box" onclick="event.stopPropagation()">
        <div id="modalContent"></div>
    </div>
</div>

<script src="{{ url_for('static', filename='js/app.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
